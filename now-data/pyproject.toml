[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "now-mcp-data"
version = "0.3.0"
description = "Live-instance ServiceNow verbs over PySNC (query, get, aggregate, gated writes), as a library and an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "now-mcp contributors" }]
keywords = ["mcp", "servicenow", "pysnc"]
# Pure Python. Every verb works on released PySNC: `now_aggregate` calls the
# Stats API over PySNC's session and doesn't need GlideAggregate (now-mcp#5).
dependencies = [
    "python-dotenv>=1.0",
    "pysnc>=1.2.1",
]

[project.optional-dependencies]
# Capped below 2.0: the SDK moved `mcp.server.fastmcp` in 2.0.
server = ["mcp>=1.0,<2"]

[project.scripts]
now-mcp-data = "now_data.server:main"

[project.urls]
Repository = "https://github.com/orwellsanimal/now-mcp"
Issues = "https://github.com/orwellsanimal/now-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["now_data"]
